name: flowboard-test

services:
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    environment:
      NODE_ENV: test
      LOG_LEVEL: silent
      DATABASE_URL: postgresql://flowboard:flowboard@db:5432/flowboard_test?schema=public
      REDIS_URL: redis://redis:6379/1
      JWT_ACCESS_SECRET: test-access-secret-min-32-chars-xxxxxxxxxxxxxxxxx
      JWT_REFRESH_SECRET: test-refresh-secret-min-32-chars-xxxxxxxxxxxxxxxx
      JWT_ACCESS_TTL: 15m
      JWT_REFRESH_TTL: 7d
    volumes:
      - ./api:/app
      - api_test_node_modules:/app/node_modules
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Keep the container alive so `docker compose exec api npx jest` works.
    # Migrations run from Jest's globalSetup; the API HTTP server is never started
    # because tests drive the Express app in-process via supertest.
    command: ["tail", "-f", "/dev/null"]

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: flowboard
      POSTGRES_PASSWORD: flowboard
      POSTGRES_DB: flowboard_test
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flowboard -d flowboard_test"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  api_test_node_modules:
